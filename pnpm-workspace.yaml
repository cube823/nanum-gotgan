# 이 파일이 리포를 "워크스페이스"로 만든다. pnpm은 여기 적힌 폴더들을 하나의 설치 단위로 본다.
# 워크스페이스 설정은 루트 하나만 유효하다 — 하위 패키지의 pnpm-workspace.yaml은 무시된다.
packages:
  - web
  - ai

# postinstall 스크립트 실행 허용 목록. pnpm은 기본적으로 의존성의 빌드 스크립트를 막는다(공급망 방어).
# 둘 다 네이티브 바이너리를 미리 받아 두는 패키지라 스크립트 없이도 동작한다.
allowBuilds:
  sharp: false
  unrs-resolver: false
